spring.application.name=clinica

server.port=8080
server.tomcat.max-threads=32
server.servlet.contextPath=/clinica/v1

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/clinica?zeroDateTimeBehavior=convertToNull&serverTimezone=America/Bogota&useSSL=false&zeroDateTimeBehavior=round
# La clave se toma de la variable de entorno DB_PASSWORD. Si no se define,
# el valor por defecto es vacio (MariaDB/MySQL de XAMPP usa root sin clave).
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
